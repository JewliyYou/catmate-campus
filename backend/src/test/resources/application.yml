spring:
  datasource:
    url: jdbc:h2:mem:catmate;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
catmate:
  cors-origin: http://localhost:5173
  session-hours: 24
