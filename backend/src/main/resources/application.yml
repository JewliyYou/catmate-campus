server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: catmate-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/catmate?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai

catmate:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  session-hours: ${SESSION_HOURS:24}
  seed-demo-users: ${SEED_DEMO_USERS:true}
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    display-name: ${INITIAL_ADMIN_DISPLAY_NAME:平台管理员}
